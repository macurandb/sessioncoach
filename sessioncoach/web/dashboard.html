  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;

    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;

  }
}

  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2e2b;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --grid: #262624; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #6b6a64;

* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
h1 { font-size: 20px; margin: 0; }
.sub { color: var(--text-secondary); font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-1); color: var(--text-secondary); padding: 6px 12px; cursor: pointer; font: inherit; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
select, .btn { font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; }
.btn { cursor: pointer; }
.spacer { flex: 1; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.tile .label { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.tile .value { font-size: 28px; font-weight: 650; margin: 2px 0; font-variant-numeric: tabular-nums; }
.tile .note { color: var(--text-muted); font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--text-secondary); }
.badge .dot { width: 8px; height: 8px; border-radius: 50%; }
h2 { font-size: 15px; margin: 0 0 4px; }
.desc { color: var(--text-secondary); font-size: 13px; margin: 0 0 10px; }
section { margin-bottom: 16px; }
.recs { display: grid; gap: 12px; }
.rec { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: start; }
.rec .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 650; }
.rec h3 { margin: 2px 0 4px; font-size: 15px; }
.rec dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 13px; }
.rec dt { color: var(--text-muted); }
.rec dd { margin: 0; color: var(--text-secondary); overflow-wrap: anywhere; }
.rec > div, .rec dl { min-width: 0; }
.rec .saving { text-align: right; }
.rec .saving b { font-size: 18px; font-variant-numeric: tabular-nums; display: block; }
.rec .saving span { font-size: 11px; color: var(--text-muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } .rec { grid-template-columns: 30px 1fr; } .rec .saving { grid-column: 2; text-align: left; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-secondary); margin: 6px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
svg text { fill: var(--text-muted); font-size: 11px; }
.chart { position: relative; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; min-width: 160px; z-index: 5; }
.tip .row { display: flex; justify-content: space-between; gap: 12px; }
.tip .row i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--text-secondary); font-weight: 600; }
td.n, th.n { text-align: right; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-0); border: 1px solid var(--border);
  border-radius: 6px; padding: 1px 6px; color: var(--text-secondary); }
.repro { margin-top: 8px; font-size: 12px; color: var(--text-muted); }
.empty { color: var(--text-muted); padding: 12px 0; }
.scroll { overflow-x: auto; }
.filters select { max-width: 100%; text-overflow: ellipsis; }
.st-sec { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; min-width: 0; }
.st-sec legend { padding: 0 6px; font-weight: 600; font-size: 13px; }
.st-row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 6px 0; }
.st-row label { display: inline-flex; align-items: center; gap: 6px; }
.st-row .st-name { min-width: 190px; color: var(--text-secondary); }
.st-row input[type=text], .st-row input[type=number], .st-row input[type=time], .st-row select { font: inherit; color: var(--text-primary);
  background: var(--surface-0); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; max-width: 100%; }
.st-row input[type=text] { width: 150px; } .st-row input[type=number] { width: 120px; }
.st-hint { color: var(--text-muted); font-size: 12px; margin: 0 0 4px; }
.st-state { font-size: 12px; color: var(--text-muted); }
.st-msg { padding: 8px 10px; border-radius: 8px; margin: 0 0 10px; border: 1px solid var(--border); overflow-wrap: anywhere; }
.st-msg.ok { border-color: var(--good); } .st-msg.err { border-color: var(--critical); }
.st-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn[disabled] { opacity: .55; cursor: default; }
pre.diff { margin: 4px 0 10px; padding: 8px 0; background: var(--surface-0); border: 1px solid var(--border); border-radius: 8px;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; }
pre.diff span { display: block; padding: 0 10px; white-space: pre; min-width: max-content; }
pre.diff .add { background: color-mix(in srgb, var(--good) 20%, transparent); }
pre.diff .del { background: color-mix(in srgb, var(--critical) 20%, transparent); }
pre.diff .hdr { color: var(--text-muted); }

<div class="wrap">

  </section>

  <section class="card" id="alerts-card">

    <div class="scroll" id="alerts-missed"></div>
    <div class="repro" id="alerts-repro"></div>
  </section>

  </section>

  <h2 style="margin:20px 0 8px" data-i18n="period_title"></h2>
  <div class="tiles" id="tiles"></div>

  <section class="card">
    <h2 data-i18n="recs_title"></h2>
    <p class="desc" data-i18n="recs_desc"></p>
    <div class="recs" id="recs"></div>
  </section>

  <section class="card">

    <div class="repro" id="weekly-repro"></div>

  <div class="grid2">

  </section>
</div>

const SLOTS = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const state = { days: 30, tenant: "", project: "", account: "", date: "", dayData: null, anon: new URLSearchParams(location.search).get("anon") === "1", lang: (navigator.language || "en").startsWith("es") ? "es" : "en", data: null };
const STORE_KEY = "sessioncoach", OLD_STORE_KEY = "daf-claude-kit";  // the old key is read once, until the first save
try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || localStorage.getItem(OLD_STORE_KEY) || "{}"); Object.assign(state, s); } catch (e) { /* storage unavailable */ }
if (state.lang !== "es") state.lang = "en";  // a stored value from elsewhere must not break t()
document.documentElement.lang = state.lang;  // before the first render: the loading and error views too
const $ = (id) => document.getElementById(id);
const t = (k) => I18N[state.lang][k] ?? k;
const fmtUSD = (v) => v == null ? "–" : new Intl.NumberFormat(state.lang, { style: "currency", currency: "USD", maximumFractionDigits: v >= 100 ? 0 : 2 }).format(v);
const fmtAxis = (v) => new Intl.NumberFormat(state.lang, { style: "currency", currency: "USD", notation: "compact", maximumFractionDigits: 1 }).format(v);
const fmtN = (v) => new Intl.NumberFormat(state.lang, { notation: "compact", maximumFractionDigits: 1 }).format(v || 0);
const fmtPct = (v) => new Intl.NumberFormat(state.lang, { style: "percent", maximumFractionDigits: 0 }).format(v || 0);
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function save() { try { localStorage.removeItem(OLD_STORE_KEY); localStorage.setItem(STORE_KEY, JSON.stringify({ days: state.days, tenant: state.tenant, project: state.project, account: state.account, lang: state.lang })); } catch (e) { /* ignore */ } }
function fill(tpl, p) { return tpl.replace(/\{(\w+)\}/g, (_, k) => k === "usd" || k.endsWith("_usd") ? fmtUSD(p[k]) : k === "share" ? fmtPct(p[k]) : k === "tokens" ? fmtN(p[k]) : esc(p[k])); }

function repro(extra) {
  const parts = ["sessioncoach report --days " + (state.days || 0)];
  if (state.tenant) parts.push("--tenant " + state.tenant);
  if (state.project) parts.push("--project '" + state.project + "'");
  if (state.account) parts.push("--account " + state.account);
  return `${t("reproduce")}: <code>${esc(parts.join(" ") + (extra || ""))}</code>`;
}

// the server restarted (new session cookie): reload to show how to get back in instead of a broken page
const lostSession = (r) => { if (r && r.status === 401) { location.reload(); return true; } return false; };

async function load() {
  const f = { tenant: state.tenant, project: state.project, account: state.account, ...(state.anon ? { anon: "1", lang: state.lang } : {}) };
  const q = new URLSearchParams({ days: state.days, ...f });
  const qd = new URLSearchParams({ date: state.date, ...f });
  const ql = new URLSearchParams(state.anon ? { anon: "1", lang: state.lang } : {});
  const [a, b, c, r, w] = await Promise.all([fetch("/api/data?" + q.toString()), fetch("/api/day?" + qd.toString()), fetch("/api/limits?" + ql.toString()),
    fetch("/api/review?" + ql.toString()), fetch("/api/alerts?" + new URLSearchParams({ days: 7, ...Object.fromEntries(ql) }).toString()).catch(() => null)]);
  if (lostSession(a)) return;
  state.data = await a.json(); state.dayData = await b.json(); state.limits = await c.json(); state.review = r.ok ? await r.json() : null;
  state.alerts = w && w.ok ? await w.json().catch(() => null) : null;  // the warnings card never takes the dashboard down
  render();
}

function renderFilters() {
  const periods = [[7, "7d"], [30, "30d"], [90, "90d"], [0, t("all")]];
  $("period").innerHTML = periods.map(([d, l]) => `<button type="button" data-d="${d}" aria-pressed="${state.days === d}">${l}</button>`).join("");
  $("period").querySelectorAll("button").forEach((b) => b.onclick = () => { state.days = +b.dataset.d; save(); load(); });
  const o = state.data.options;
  $("tenant").innerHTML = `<option value="">${t("all_tenants")}</option>` + o.tenants.map((x) => `<option ${x === state.tenant ? "selected" : ""}>${esc(x)}</option>`).join("");
  $("project").innerHTML = `<option value="">${t("all_projects")}</option>` + o.projects.map((x) => `<option ${x === state.project ? "selected" : ""}>${esc(x)}</option>`).join("");
  $("account").innerHTML = `<option value="">${t("all_accounts")}</option>` + o.accounts.map((x) => `<option value="${esc(x.id)}" ${x.id === state.account ? "selected" : ""}>${esc(x.label)}</option>`).join("");
  $("lang").textContent = state.lang === "es" ? "EN" : "ES";
  $("anon").textContent = state.anon ? t("anon_on") : t("anon_off");
  $("anon").setAttribute("aria-pressed", String(state.anon));
  $("anon-badge").style.display = state.anon ? "inline-flex" : "none";
  $("anon-badge").textContent = t("anon_badge");
  const demo = !!state.data.demo;
  $("demo-banner").style.display = demo ? "block" : "none";
  $("demo-banner").textContent = t("demo_banner");
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => el.textContent = t(el.dataset.i18n));
}

function badge(status) {
  const map = { PASS: ["--good", "✓ " + t("verified")], CHECK: ["--warning", "⚠ " + t("check")], "NO DATA": ["--text-muted", "∅ " + t("nodata")] };
  const [c, l] = map[status] || map["NO DATA"];
  return `<span class="badge"><span class="dot" style="background:var(${c})"></span>${l}</span>`;
}

function renderTiles() {
  const s = state.data.summary, v = state.data.verification;
  const status = v.backtest === "PASS" && v.conservation.status === "PASS" ? "PASS" : (v.backtest === "NO DATA" ? "NO DATA" : "CHECK");
  let delta = "";
  if (s.prev_total_usd && s.prev_active_days < s.active_days * 0.5) {
    delta = t("prev_thin");
  } else if (s.prev_total_usd) {
    const d = (s.total_usd - s.prev_total_usd) / s.prev_total_usd;
    delta = `${d >= 0 ? "▲" : "▼"} ${fmtPct(Math.abs(d))} ${t("vs_prev")} (${fmtUSD(s.prev_total_usd)})`;
  }
  $("tiles").innerHTML = `
    <div class="card tile"><div class="label">${t("total")}</div><div class="value">${fmtUSD(s.total_usd)}</div>
      <div class="note">${fmtUSD(s.recorded_usd)} ${t("recorded")} · ≈ ${fmtUSD(s.estimated_usd)} ${t("estimated")}</div>
      <div class="note">${badge(status)} ${delta ? " · " + delta : ""}</div></div>
    <div class="card tile"><div class="label">${t("per_day")}</div><div class="value">${fmtUSD(s.active_days ? s.total_usd / s.active_days : 0)}</div>
      <div class="note">${s.active_days} ${t("active_days")}</div></div>
    <div class="card tile"><div class="label">${t("sessions")}</div><div class="value">${s.sessions}</div>
      <div class="note">${fmtN(s.requests)} ${t("requests")}</div></div>
    <div class="card tile"><div class="label">${t("about")}</div><div class="value" style="font-size:16px;font-weight:500;line-height:1.35">${t("eq_note")}</div></div>`;
}

function renderRecs() {

    return `<div class="rec"><div class="num">${i + 1}</div>

function color(series, i) { return series[i] === "other" ? "var(--other)" : `var(${SLOTS[i % SLOTS.length]})`; }

function renderWeekly() {
  const w = state.data.weekly, el = $("weekly");
  if (!w.weeks.length) { el.innerHTML = `<div class="empty">${t("no_data")}</div>`; $("weekly-legend").innerHTML = ""; $("weekly-table").innerHTML = ""; return; }
  const W = Math.max(320, el.clientWidth || 800), H = 240, m = { l: 80, r: 8, t: 8, b: 26 };
  const totals = w.weeks.map((x) => w.series.reduce((a, s) => a + (x.values[s] || 0), 0));
  const max = niceMax(Math.max(...totals, 1));
  const n = w.weeks.length, band = (W - m.l - m.r) / n, bw = Math.min(48, band * 0.62);
  const y = (v) => H - m.b - (v / max) * (H - m.t - m.b);
  let svg = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(t("weekly_title"))}">`;
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = y(v);
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${yy + 4}" text-anchor="end">${fmtAxis(v)}</text>`; }
  w.weeks.forEach((wk, i) => {
    const x = m.l + band * i + (band - bw) / 2; let acc = 0;
    const segs = w.series.map((s, j) => [j, wk.values[s] || 0]).filter(([, v]) => v > 0);
    segs.forEach(([j, v], k) => {
      const y0 = y(acc), y1 = y(acc + v); acc += v;
      const h = Math.max(0, y0 - y1 - (k < segs.length - 1 ? 2 : 0));
      const top = k === segs.length - 1;
      svg += top ? `<path d="${roundTop(x, y0 - h, bw, h, 4)}" fill="${color(w.series, j)}"/>` : `<rect x="${x}" y="${y0 - h}" width="${bw}" height="${h}" fill="${color(w.series, j)}"/>`;
    });
    const label = new Date(wk.week + "T00:00").toLocaleDateString(state.lang, { day: "numeric", month: "short" });
    if (n <= 16 || i % Math.ceil(n / 12) === 0) svg += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${label}</text>`;
    svg += `<rect x="${m.l + band * i}" y="${m.t}" width="${band}" height="${H - m.t - m.b}" fill="transparent" data-i="${i}"/>`;
  });
  svg += `</svg><div class="tip" id="weekly-tip"></div>`;
  el.innerHTML = svg;
  const tip = $("weekly-tip");
  el.querySelectorAll("rect[data-i]").forEach((r) => {
    r.addEventListener("mousemove", (ev) => {
      const wk = w.weeks[+r.dataset.i], tot = totals[+r.dataset.i];
      const rows = w.series.map((s, j) => [s, j, wk.values[s] || 0]).filter((x) => x[2] > 0).reverse();
      tip.innerHTML = `<b>${t("week")} ${esc(wk.week)}</b> · ${fmtUSD(tot)}` + rows.map(([s, j, v]) =>
        `<div class="row"><span><i style="background:${color(w.series, j)}"></i>${esc(s === "other" ? t("other") : s)}</span><span>${fmtUSD(v)}</span></div>`).join("");
      tip.style.display = "block";
      const bx = el.getBoundingClientRect(); let left = ev.clientX - bx.left + 14;
      if (left + 200 > bx.width) left = ev.clientX - bx.left - 214;
      tip.style.left = left + "px"; tip.style.top = Math.max(0, ev.clientY - bx.top - 20) + "px";
    });
    r.addEventListener("mouseleave", () => tip.style.display = "none");
  });
  $("weekly-legend").innerHTML = w.series.map((s, j) => `<span><i style="background:${color(w.series, j)}"></i>${esc(s === "other" ? t("other") : s)}</span>`).join("");
  $("weekly-table").innerHTML = table([t("week"), ...w.series.map((s) => s === "other" ? t("other") : s)],
    w.weeks.map((wk) => [wk.week, ...w.series.map((s) => fmtUSD(wk.values[s] || 0))]), [false, ...w.series.map(() => true)]);
  $("weekly-repro").innerHTML = repro();
}

function ago(iso) {
  if (!iso) return "–";
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  return m < 120 ? t("min_ago").replace("{n}", m) : t("h_ago").replace("{n}", Math.round(m / 60));
}

function deltaTxt(cur, prev) {
  if (!prev) return "";
  const d = (cur - prev) / prev;
  return `${d >= 0 ? "▲" : "▼"} ${fmtPct(Math.abs(d))}`;
}

function renderDay() {
  const d = state.dayData; if (!d) return;
  if (!state.date) $("day-date").value = d.date; else $("day-date").value = state.date;
  const fees = d.accounts.filter((a) => a.fee_day_usd).map((a) => fmtUSD(a.fee_day_usd));

function signed(v) { return (v > 0 ? "+" : v < 0 ? "−" : "") + fmtUSD(Math.abs(v)); }

function renderDayChart(d) {
  const el = $("day-chart");
  const W = Math.max(300, el.clientWidth || 800), H = 200, m = { l: 80, r: 12, t: 10, b: 24 };
  const series = [["prev", "var(--s2)", t("prev_day")], ["today", "var(--s1)", d.is_today ? t("today") : t("that_day")]];
  const max = niceMax(Math.max(1, ...d.cumulative.today, ...d.cumulative.prev));
  const x = (h) => m.l + (h / 23) * (W - m.l - m.r), y = (v) => H - m.b - (v / max) * (H - m.t - m.b);
  let svg = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(t("cum"))}">`;
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = y(v);
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${yy + 4}" text-anchor="end">${fmtAxis(v)}</text>`; }
  for (let h = 0; h < 24; h += 3) svg += `<text x="${x(h)}" y="${H - 6}" text-anchor="middle">${String(h).padStart(2, "0")}h</text>`;
  series.forEach(([k, c]) => {
    const pts = d.cumulative[k].map((v, h) => `${x(h)},${y(v)}`).join(" ");
    if (pts) svg += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = d.cumulative[k].length - 1;
    if (last >= 0) svg += `<circle cx="${x(last)}" cy="${y(d.cumulative[k][last])}" r="4" fill="${c}" stroke="var(--surface-1)" stroke-width="2"/>`;
  });
  svg += `<line id="day-cross" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-muted)" stroke-dasharray="3 3" style="display:none"/>`;
  svg += `<rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" id="day-hit"/></svg><div class="tip" id="day-tip"></div>`;
  el.innerHTML = svg;
  const hit = $("day-hit"), tip = $("day-tip"), cross = $("day-cross");
  hit.addEventListener("mousemove", (ev) => {
    const bx = el.getBoundingClientRect(), px = ev.clientX - bx.left;
    const h = Math.max(0, Math.min(23, Math.round((px - m.l) / (W - m.l - m.r) * 23)));
    cross.setAttribute("x1", x(h)); cross.setAttribute("x2", x(h)); cross.style.display = "block";
    tip.innerHTML = `<b>${t("hour")} ${String(h).padStart(2, "0")}:59 · ${t("cum")}</b>` + series.slice().reverse().map(([k, c, l]) =>
      `<div class="row"><span><i style="background:${c}"></i>${esc(l)}</span><span>${d.cumulative[k][h] == null ? "–" : fmtUSD(d.cumulative[k][h])}</span></div>`).join("");
    tip.style.display = "block"; let left = px + 14; if (left + 200 > bx.width) left = px - 214;
    tip.style.left = left + "px"; tip.style.top = Math.max(0, ev.clientY - bx.top - 20) + "px";
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; cross.style.display = "none"; });
  $("day-legend").innerHTML = series.slice().reverse().map(([, c, l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join("");
}

function hm(epoch) { return new Date(epoch * 1000).toLocaleTimeString(state.lang, { hour: "2-digit", minute: "2-digit" }); }
function dhm(epoch) { return new Date(epoch * 1000).toLocaleString(state.lang, { weekday: "short", hour: "2-digit", minute: "2-digit" }); }

function meter(label, pct, reset, eta, ths) {
  const col = pct >= 90 ? "var(--critical)" : pct >= 75 ? "var(--warning)" : "var(--s1)";
  const marks = (ths || []).map(Number).filter(Number.isFinite).map((th) => `<line x1="${th}" x2="${th}" y1="0" y2="14" stroke="var(--text-muted)" stroke-width="0.6"/>`).join("");
  return `<div style="margin:8px 0">
    <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text-secondary)">${label}</span>
      <span><b style="font-variant-numeric:tabular-nums">${Math.round(pct)}%</b> · ${t("resets")} ${label === t("w5") ? hm(reset) : dhm(reset)}</span></div>
    <svg height="14" width="100%" preserveAspectRatio="none" viewBox="0 0 100 14"><rect x="0" y="3" width="100" height="8" rx="4" fill="var(--grid)"/>
      <rect x="0" y="3" width="${Math.min(100, Math.max(0.5, pct))}" height="8" rx="4" fill="${col}"/>${marks}</svg>
    ${eta ? `<div style="font-size:12px;color:var(--critical)">⚠ ${esc(t("pace_warn").replace("{e}", hm(eta)))}</div>` : ""}</div>`;
}

function bars(rows, nameFn) {

    <svg height="10" width="100%" preserveAspectRatio="none" viewBox="0 0 100 10"><rect x="0" y="1" width="100" height="8" rx="4" fill="var(--grid)"/>
      <rect x="0" y="1" width="${Math.max(0.5, r.share * 100)}" height="8" rx="4" fill="var(${SLOTS[i % SLOTS.length]})"/></svg>
    <span style="text-align:right;font-variant-numeric:tabular-nums">${fmtPct(r.share)}</span></div>`).join("");
}

  }
  html += `</div></div>`;
  el.innerHTML = html;

const VERDICT_COLOR = { good: "--good", bad: "--critical", costly: "--warning" };
function tsLocal(s) { return s ? new Date(/(Z|[+-]\d\d:\d\d)$/.test(s) ? s : s + "Z") : null; }
function whenTxt(s) { const d = tsLocal(s); return d ? d.toLocaleString(state.lang, { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "–"; }
function alertWhy(e) {
  const d = e.data || {}, min = (v) => Math.round((v || 0) / 60);
  const p = { idle: min(d.idle_s), ttl: min(d.limit_s || d.ttl_s || 3600), rem: min(d.remaining_s), ctx: fmtN(d.context), pct: Math.round(d.pct || 0),
    th: d.threshold, eta: d.eta ? hm(d.eta) : "", name: d.name || "", used: fmtUSD(d.used_usd), limit: fmtUSD(d.limit_usd),
    proj: fmtUSD(d.projected_usd), thk: fmtN(d.threshold) };
  return (t("alw_" + e.source) || "").replace(/\{(\w+)\}/g, (_, k) => p[k] ?? "");
}
function alertOutcome(o) {

    usd: fmtUSD(o.usd), exp: whenTxt(o.expires_at) };

function table(head, rows, num) {

}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v) return k * p; return 10 * p; }
function roundTop(x, y, w, h, r) { r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }

  if (proj) {
    const dest = (sc.cut_rule_in && sc.cut_rule_in[0]) || sx.dest || "local";
    cutNote = `<div class="st-row" role="radiogroup" aria-label="${esc(t("st_cut_dest"))}"><span class="st-name">${t("st_cut_dest")}</span>` +
      ["local", "shared"].map((k) => `<label><input type="radio" name="st-dest" id="st-dest-${k}" value="${k}" ${dest === k ? "checked" : ""}> ${t("st_dest_" + k)}</label>`).join("") + `</div>` +
      `<p class="st-hint" id="st-dest-d">${t("st_dest_" + dest + "_d")}</p>` +
      `<div class="st-row" id="st-gi-row" ${sc.gitignore_needed && dest === "local" ? "" : 'style="display:none"'}><label class="st-name"><input type="checkbox" id="st-gi" checked> <b>${t("st_gitignore")}</b></label></div>` +
      `<p class="st-hint" id="st-gi-d" ${sc.gitignore_needed && dest === "local" ? "" : 'style="display:none"'}>${t("st_gitignore_d")}</p>`;
  } else if (sc.hook_in_projects && sc.hook_in_projects.length) {
    cutNote = "";
    hookNote = hint(fill(t("st_hook_in_projects"), { p: sc.hook_in_projects.map((x) => x.label).join(", ") })) +
      `<div class="st-row"><label class="st-name"><input type="checkbox" id="st-rmproj"> <b>${t("st_rm_proj")}</b></label></div>`;
  }
  el.innerHTML = (sc.error ? `<div class="st-msg err">${esc(fill(t("st_invalid"), { e: sc.error }))}</div>` : "") +
    `<p class="st-hint">${t("st_file")}: <code>${esc(sc.settings_file)}</code> · <code>${esc(sc.claude_md_file)}</code>${proj ? ` · <code>${esc(sc.claude_md_shared_file)}</code>` : ""}</p>` +
    row("st-hook", "nudge_hook", sc.nudge_hook, "st_hook_d", blocked, hookNote) + row("st-sl", "statusline", sc.statusline, "st_statusline_d", false, slNote) +
    row("st-cut", "cut_rule", sc.cut_rule, "st_cut_d", false, cutNote);
}
function stRender() {
  const d = sx.data; if (!d) return;
  const kinds = ["global", "company", "project"];
  const opts = kinds.map((k) => { const l = d.scopes.filter((x) => x.kind === k); return l.length ? `<optgroup label="${esc(t("st_scope_" + k))}">` +
    l.map((x) => `<option value="${esc(x.id)}" ${x.id === sx.scope ? "selected" : ""}>${esc(x.kind === "global" ? x.label : x.label)}</option>`).join("") + `</optgroup>` : ""; }).join("");
  const num = (id, v, lo, hi) => `<input type="number" id="${id}" value="${esc(v)}" min="${lo}" max="${hi}" step="1" inputmode="numeric">`;
  const list = (id, v) => `<input type="text" id="${id}" value="${esc((v || []).join(", "))}" inputmode="numeric">`;
  const chk = (id, on, label) => `<label><input type="checkbox" id="${id}" ${on ? "checked" : ""}> ${label}</label>`;
  const a = d.alerts, n = d.nudge, r = d.review;
  $("st-body").innerHTML =
    `<fieldset class="st-sec"><legend>${t("st_scope")}</legend><div class="st-row"><select id="st-scope" aria-label="${esc(t("st_scope"))}">${opts}</select></div>` +
    `<p class="st-hint">${t("st_scope_hint")}</p><div id="st-scope-body"></div></fieldset>` +
    `<fieldset class="st-sec"><legend>${t("st_thresholds")}</legend><p class="st-hint">${t("st_th_hint")}</p>` +
    `<div class="st-row"><span class="st-name">${t("st_five")}</span>${list("st-five", a.five_hour)}</div>` +
    `<div class="st-row"><span class="st-name">${t("st_seven")}</span>${list("st-seven", a.seven_day)}</div>` +
    `<div class="st-row"><span class="st-name">${t("st_context")}</span>${list("st-context", a.context)}</div>` +
    `<div class="st-row"><span class="st-name">${t("st_ctxtok")}</span>${list("st-ctxtok", a.context_tokens)}</div>` +
    `<div class="st-row">${chk("st-projection", a.projection, t("st_projection"))}${chk("st-notify", a.notify, t("st_notify"))}</div>` +
    `<div class="st-row"><span class="st-name">${t("st_lang")}</span><select id="st-lang"><option value="">${t("st_lang_auto")}</option>` +
    `<option value="es" ${a.lang === "es" ? "selected" : ""}>ES</option><option value="en" ${a.lang === "en" ? "selected" : ""}>EN</option></select></div></fieldset>` +
    `<fieldset class="st-sec"><legend>${t("st_nudge")}</legend>` +
    `<div class="st-row"><span class="st-name">${t("st_idle")}</span>${num("st-idle", n.idle_min, 1, 1440)}</div>` +
    `<div class="st-row"><span class="st-name">${t("st_minctx")}</span>${num("st-minctx", n.min_context_tokens, 1000, 10000000)}</div></fieldset>` +
    `<fieldset class="st-sec"><legend>${t("st_review")}</legend>` +
    `<div class="st-row">${chk("st-rv-enabled", r.enabled, t("st_rv_enabled"))}</div>` +
    `<div class="st-row"><span class="st-name">${t("st_rv_time")}</span><input type="time" id="st-rv-time" value="${esc(r.time)}"></div>` +
    `<div class="st-row"><span class="st-name">${t("st_rv_days")}</span>${d.weekdays.map((w) => chk("st-wd-" + w, (r.days || []).includes(w), t("st_wd_" + w))).join("")}</div>` +
    `<div class="st-row"><span class="st-name">${t("st_rv_channels")}</span>${d.channels.map((c) => chk("st-ch-" + c, (r.channels || []).includes(c), t("st_ch_" + c))).join("")}</div>` +
    `<div class="st-row"><span class="st-name">${t("st_rv_lookback")}</span><select id="st-lb"><option value="last_active" ${r.lookback === "last_active" ? "selected" : ""}>${t("st_rv_last")}</option>` +
    `<option value="n" ${r.lookback !== "last_active" ? "selected" : ""}>${t("st_rv_ndays")}</option></select>${num("st-lbn", r.lookback === "last_active" ? 1 : r.lookback, 0, 60)}</div>` +
    `<div class="st-row"><span class="st-name">${t("st_rv_tips")}</span>${num("st-tips", r.max_tips, 1, 5)}</div>` +
    `<div class="st-row"><span class="st-name">${t("st_rv_long")}</span>${num("st-long", r.long_context_tokens, 10000, 10000000)}</div>` +
    `<div class="st-row">${chk("st-agent", d.review_agent, t("st_rv_agent"))}</div><p class="st-hint">${t("st_rv_agent_d")}</p></fieldset>` +
    `<div class="st-actions"><button class="btn" type="button" id="st-defaults">${t("st_defaults")}</button>` +
    `<button class="btn primary" type="button" id="st-preview">${t("st_preview")}</button></div>`;
  stRenderScope();
}
function stNums(id) { return $(id).value.split(/[,\s]+/).filter(Boolean).map(Number); }
function stNum(id) { const v = $(id).value; return v === "" ? null : Number(v); }
function stPayload() {
  const sc = stScopeState(); const p = { scope: sc.id, lang: state.lang };
  if (sc.nudge_hook !== null && !$("st-hook").disabled) p.nudge_hook = $("st-hook").checked;
  if (sc.statusline !== null) p.statusline = $("st-sl").checked;
  if (sc.cut_rule !== null) p.cut_rule = $("st-cut").checked;
  if (sc.kind === "project") {
    p.cut_dest = $("st-dest-shared").checked ? "shared" : "local";
    if (p.cut_rule && p.cut_dest === "local" && $("st-gi-row").style.display !== "none") p.gitignore = $("st-gi").checked;
  } else if ($("st-rmproj")) p.remove_project_hooks = $("st-rmproj").checked && p.nudge_hook === true;
  p.review_agent = $("st-agent").checked;
  const days = sx.data.weekdays.filter((w) => $("st-wd-" + w).checked), chans = sx.data.channels.filter((c) => $("st-ch-" + c).checked);
  p.alerts = { five_hour: stNums("st-five"), seven_day: stNums("st-seven"), context: stNums("st-context"), context_tokens: stNums("st-ctxtok"),
    projection: $("st-projection").checked, notify: $("st-notify").checked, lang: $("st-lang").value || null,
    nudge: { idle_min: stNum("st-idle"), min_context_tokens: stNum("st-minctx") },
    review: { enabled: $("st-rv-enabled").checked, time: $("st-rv-time").value, days, channels: chans,
      lookback: $("st-lb").value === "last_active" ? "last_active" : stNum("st-lbn"), max_tips: stNum("st-tips"), long_context_tokens: stNum("st-long") } };
  return p;
}
function stClearDiff() { sx.preview = null; sx.payload = null; $("st-diff").innerHTML = ""; }
function diffHtml(text) {
  return text.split("\n").filter((l, i, a) => l !== "" || i < a.length - 1).map((l) => `<span class="${l.startsWith("+++") || l.startsWith("---") || l.startsWith("@@") ? "hdr" : l[0] === "+" ? "add" : l[0] === "-" ? "del" : ""}">${esc(l) || " "}</span>`).join("");
}
function stShowPreview(pv) {
  const warn = (pv.warnings || []).map((w) => `<div class="st-msg">${esc(w.code === "hook_duplicate_global" ? t("st_dup_hook") : w.code === "statusline_shadows_superior" ? fill(t("st_w_statusline"), { s: w.superior }) : w.code === "hook_in_projects" ? fill(t("st_w_projects"), { p: (w.projects || []).join(", ") }) : w.code === "legacy_agent_retired" ? fill(t("st_w_legacy_agent"), { p: w.path }) : w.code)}</div>`).join("");
  if (!pv.files.length) { $("st-diff").innerHTML = ""; return stMsg("ok", t("st_nochanges")); }
  $("st-diff").innerHTML = `<h3 style="font-size:14px;margin:14px 0 4px">${t("st_diff_title")}</h3><p class="st-hint">${t("st_redacted")}</p>${warn}` +
    pv.files.map((f) => `<div class="desc" style="margin:8px 0 0"><code>${esc(f.display)}</code>${f.exists ? "" : " · " + t("st_new")}</div><pre class="diff">${diffHtml(f.diff)}</pre>`).join("") +
    `<div class="st-actions"><button class="btn primary" type="button" id="st-apply">${t("st_apply")}</button><button class="btn" type="button" id="st-cancel">${t("st_cancel")}</button></div>`;
  stMsg("", t("st_confirm"));
}
function stError(e) {
  stMsg("err", e.status === 409 ? t("st_stale") : fill(t("st_err"), { e: e.message }));
}
async function stLoad() {
  try { sx.data = await sapi("GET", "/api/settings"); if (!sx.data.scopes.some((x) => x.id === sx.scope)) sx.scope = "global"; stRender(); }
  catch (e) { stError(e); }
}
function stVisibility() {
  const show = !state.anon && !(state.data && state.data.demo);  // the demo never edits the real settings
  $("settings-btn").style.display = show ? "" : "none";
  $("settings-btn").textContent = t("settings");
  $("settings-btn").setAttribute("aria-expanded", String(show && sx.open));
  $("settings-card").style.display = show && sx.open ? "" : "none";
  if (!show) { sx.open = false; sx.data = null; $("st-body").innerHTML = ""; stClearDiff(); stMsg("", ""); }
  else if (sx.open && sx.data && sx.lang !== state.lang) { sx.lang = state.lang; stClearDiff(); stMsg("", ""); stRender(); }
}
$("settings-btn").onclick = async () => {
  sx.open = !sx.open; sx.lang = state.lang; stVisibility();
  if (sx.open) { await stLoad(); $("settings-card").scrollIntoView({ behavior: "smooth", block: "start" }); }
};
const stCard = $("settings-card");
stCard.addEventListener("input", () => { if (sx.preview) { stClearDiff(); stMsg("", ""); } });
stCard.addEventListener("change", (e) => {
  if (e.target.name === "st-dest") {
    sx.dest = e.target.value; const sc = stScopeState(); const loc = sx.dest === "local";
    $("st-dest-d").textContent = t("st_dest_" + sx.dest + "_d");
    $("st-gi-row").style.display = $("st-gi-d").style.display = loc && sc.gitignore_needed ? "" : "none";
  }
  if (e.target.id === "st-scope") { sx.dest = null; sx.scope = e.target.value; stClearDiff(); stMsg("", ""); stRenderScope(); }
});
stCard.addEventListener("click", async (e) => {
  const id = e.target.id; if (!id || !id.startsWith("st-")) return;
  if (id === "st-defaults") {
    const df = sx.data.defaults; Object.assign(sx.data.alerts, df.alerts, { lang: null }); Object.assign(sx.data.nudge, df.nudge); Object.assign(sx.data.review, df.review);
    const keep = sx.scope; stClearDiff(); stMsg("", ""); stRender(); sx.scope = keep;
  } else if (id === "st-preview") {
    e.target.disabled = true; stMsg("", t("st_working"));
    try { sx.payload = stPayload(); sx.preview = await sapi("POST", "/api/settings/preview", sx.payload); stShowPreview(sx.preview); }
    catch (err) { stClearDiff(); stError(err); } finally { e.target.disabled = false; }
  } else if (id === "st-cancel") { stClearDiff(); stMsg("", ""); }
  else if (id === "st-apply" && sx.preview) {
    e.target.disabled = true; stMsg("", t("st_working"));
    try {
      const body = { ...sx.payload, files: sx.preview.files.map((f) => ({ path: f.path, before: f.before, after: f.after })) };
      const res = await sapi("POST", "/api/settings/apply", body);
      stClearDiff(); await stLoad();
      stMsg("ok", fill(t("st_applied"), { b: res.applied.map((a) => a.backup || t("st_no_backup")).join(" · ") }));
    } catch (err) { e.target.disabled = false; if (err.status === 409) stClearDiff(); stError(err); }
  }
});
window.addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => { renderWeekly(); if (state.dayData) renderDayChart(state.dayData); }, 150); });
load();
</script>
